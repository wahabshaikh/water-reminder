name: Build Sippy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      # A stable asset name keeps the landing page's
      # /releases/latest/download/sippy.apk link working forever.
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk sippy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sippy-apk
          path: sippy.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sippy.apk
          body: |
            💧 Sippy — a very cute water reminder.

            Download `sippy.apk` below and open it on your Android phone.
